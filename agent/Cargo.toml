[package]
name = "parade-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

# No C library, no metrics framework, no async runtime. Metrics come from the
# kernel's /proc + /sys pseudo-filesystems and a raw statfs(2) syscall (see
# src/syscall.rs), giving the smallest possible binary, the widest kernel
# compatibility, and zero libc dependency in the collection path.
#
# TLS is the safe default and is required for every non-loopback Hub. It pulls
# in rustls/ring, so cross-architecture release builds use `cross`.
[features]
default = ["tls"]
tls = ["ureq/tls"]

[dependencies]
parade-common = { version = "1.0.0", path = "../common" }
# no default features ⇒ no TLS/ring unless the `tls` feature is enabled
ureq = { version = "2.9", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ed25519-dalek = "2"
getrandom = "0.2"
postcard = { version = "1", default-features = false, features = ["alloc"] }
