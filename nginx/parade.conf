# Parade TLS reverse proxy. Replace parade.example.com and certificate paths,
# then validate with `nginx -t` before reloading nginx.
#
# Matching Hub configuration:
#   public_url = "https://parade.example.com"
#   trusted_proxies = ["127.0.0.1", "::1"]
#   secure_cookies = true

server {
    listen 80;
    listen [::]:80;
    server_name parade.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://parade.example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name parade.example.com;

    ssl_certificate     /etc/letsencrypt/live/parade.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parade.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Signed reports are capped at 256 KiB by the Hub. Keep the edge close to
    # that bound; Agent binaries and manifests are response bodies, not uploads.
    client_max_body_size 512k;

    location / {
        proxy_pass http://127.0.0.1:8008;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwrite client input. The Hub trusts this header only from an
        # explicitly configured immediate proxy address.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
